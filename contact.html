<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Chess Fundamentals | Contact</title>
    </head>

    <body>
        <header>
            <h1 id="page-title">Chess: Contacts</h1>
        </header>

        <nav aria-label="Links sociais e de navegação secundária">
            
            <ul>
                <li><a href="index.html" >Home</a></li>
                <li><a href="about.html" >Content</a></li>
                <li><a href="contact.html" >Contacts</a></li>
            </ul>

        </nav>

        <main>
            <section id="contact">
                <h2>Contact form</h2>

                <form action="contact.html" method="GET">

                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" required></textarea>

                    <button type="submit">Send</button>

                </form>

                <p>Warning: this form does NOT send an actual e-mail and does not save messages, as it's a demonstrative form.</p>

            </section>

        </main>

        <footer>

            <p>&copy; 2025 calleser. All rights reserved.</p>

        </footer>

    </body>

</html>
